info:
  name: Get Menu
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/menu"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.length > 0) {
          bru.setEnvVar("itemId", body[0].id);
          bru.setEnvVar("itemPrice", body[0].price);
          bru.setEnvVar("itemStock", body[0].stock);
        }
    - type: tests
      code: |-
        test("status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        const body = res.getBody();

        test("menu should be an array", function () {
          expect(body).to.be.an("array");
        });

        test("menu should contain at least 2 items", function () {
          expect(body.length).to.be.at.least(2);
        });

        test("first item should have required fields", function () {
          expect(body[0]).to.have.property("id");
          expect(body[0]).to.have.property("name");
          expect(body[0]).to.have.property("price");
          expect(body[0]).to.have.property("stock");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
