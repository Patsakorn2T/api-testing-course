info:
  name: Create Order Negative Quantity
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/orders"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "itemId": 1,
        "quantity": -1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("negative quantity should be rejected", function () {
          expect(res.getStatus()).to.be.oneOf([400, 422]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
